[project]
name = "jobagent"
version = "0.1.0"
description = "Scrape tech job postings from ATS public APIs (Greenhouse, Lever, Ashby), browse them in a web dashboard, and get Slack digest notifications."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    "aiosqlite>=0.20",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
